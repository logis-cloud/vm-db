version: '3.8'

services:
  mysql-clients:
    image: mysql:8.0
    container_name: mysql-clients
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: clients_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_clients_data:/var/lib/mysql
      # Se ejecuta UNA sola vez, solo si el volumen está vacío (primer arranque).
      - ./clients/01_schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-vehicles:
    image: postgres:16
    container_name: postgres-vehicles
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: vehicles_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_vehicles_data:/var/lib/postgresql/data
      # Se ejecuta UNA sola vez, solo si el volumen está vacío (primer arranque).
      - ./vehicles/01_schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicles_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-shipments:
    image: mongo:7
    container_name: mongodb-shipments
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
      MONGO_INITDB_DATABASE: shipments_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_shipments_data:/data/db
      # A diferencia de MySQL/Postgres, Mongo no necesita un script de
      # creación de tablas/colecciones: las crea sola al primer insert.
      # El "validador de schema" en este stack es el mongoose.Schema
      # dentro de ms-envios (envio.model.js), no un script SQL aquí.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql_clients_data:
  postgres_vehicles_data:
  mongodb_envios_data:
